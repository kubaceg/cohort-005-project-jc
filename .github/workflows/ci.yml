name: CI
on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:coverage -- --coverage.reporter=text --coverage.reporter=text-summary | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Fail if schema.ts has no matching migration
        run: |
          npm run db:generate
          test -z "$(git status --porcelain drizzle)" || { git status --porcelain drizzle; exit 1; }
  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run knip
